<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="planet" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0d090"/>
      <stop offset="50%" stop-color="#c47a28"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8c8a0" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e8dcc0"/>
      <stop offset="70%" stop-color="#c8b890"/>
      <stop offset="100%" stop-color="#d8c8a0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#050510"/>
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.2"/><circle cx="140" cy="70" r="1"/><circle cx="520" cy="50" r="1.4"/>
    <circle cx="580" cy="120" r="1"/><circle cx="90" cy="200" r="1.1"/><circle cx="480" cy="300" r="1.3"/>
  </g>
  <ellipse cx="380" cy="200" rx="200" ry="28" fill="url(#ring)" opacity="0.85" transform="rotate(-18 380 200)"/>
  <circle cx="360" cy="190" r="95" fill="url(#planet)"/>
  <ellipse cx="380" cy="200" rx="200" ry="28" fill="none" stroke="#e8dcc0" stroke-width="6" opacity="0.35" transform="rotate(-18 380 200)"/>
  <!-- probe -->
  <g transform="translate(140 120)">
    <rect x="0" y="20" width="70" height="18" rx="3" fill="#b0b8c0"/>
    <rect x="70" y="10" width="10" height="40" fill="#8890a0"/>
    <circle cx="20" cy="29" r="8" fill="#6ec5ff"/>
    <rect x="-30" y="24" width="30" height="8" fill="#889"/>
    <polygon points="100,0 130,30 100,60" fill="#9aa" opacity="0.8"/>
  </g>
</svg>
